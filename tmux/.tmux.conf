# ~/.tmux.conf
#
# Plugins (tmux-resurrect, tmux-continuum) are plain `git clone`s into
# ~/.tmux/plugins, cloned/updated by install.sh — same pattern this repo
# already uses for zsh plugins. No TPM: one less moving part to understand.

# --- prefix -----------------------------------------------------------
# C-b is awkward to reach. C-a is the classic screen/tmux alternative;
# it shadows readline's "beginning of line", so `bind C-a send-prefix`
# below restores that with a double-tap (C-a C-a).
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g base-index 1          # windows/panes start at 1, matching the number row
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10        # don't wait after Esc - keeps nvim mode switches snappy
set -g history-limit 10000

# --- vi-style pane navigation & resize ---------------------------------
setw -g mode-keys vi
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# --- seamless nvim <-> tmux pane navigation (vim-tmux-navigator) ------
# Ctrl+hjkl moves between panes; if the current pane is running (n)vim,
# the keystroke is forwarded to it instead so nvim's own split navigation
# takes over. Needs the matching nvim plugin (see dotfiles/nvim), which
# defines what happens once the keystroke reaches vim.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# --- project switcher ---------------------------------------------------
# fzf over a fixed list of project directories (see ~/.local/bin/tmux-sessionizer).
# Runs in a popup (not a new window) so it closes itself on exit - nothing
# left behind after you jump to the picked session.
bind-key f display-popup -E -w 80% -h 80% "~/.local/bin/tmux-sessionizer"

# --- lazygit popup -------------------------------------------------------
# -E closes the popup as soon as lazygit exits, dropping you back exactly
# where you were - no extra pane to clean up.
bind-key g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"

# --- session persistence settings (plugins load at the bottom) ----------
set -g @resurrect-strategy-nvim 'session'  # restore nvim's own :mksession, not just the empty buffer
set -g @continuum-restore 'on'             # auto-restore last session when tmux server starts

# --- status bar: session name + git branch, nothing else ---------------
# catppuccin mocha palette, matching the nvim/lazygit theme
set -g status-style 'bg=#1e1e2e,fg=#cdd6f4'
set -g status-left-length 30
set -g status-left '#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#89b4fa]'
set -g status-right-length 60
set -g status-right '#[fg=#6c7086]#(cd #{pane_current_path} 2>/dev/null && git branch --show-current 2>/dev/null | sed "s/^/ /")'
setw -g window-status-current-format '#[fg=#f9e2af,bold] #I:#W '
setw -g window-status-format '#[fg=#6c7086] #I:#W '

# --- plugins, loaded last on purpose ------------------------------------
# tmux-continuum arms its periodic save by *prepending* an interpolation to
# status-right (add_resurrect_save_interpolation in continuum.tmux). These
# lines used to sit above the status bar block, so the `set -g status-right`
# a few lines down replaced the whole value - hook included - and nothing was
# ever saved: the newest snapshot on this machine was two weeks stale, holding
# a single empty session, while @continuum-restore stayed on and would have
# restored exactly that after a reboot.
#
# Loading plugins after everything they might touch is the general rule here,
# not a workaround for this one option.
run-shell "~/.tmux/plugins/tmux-resurrect/resurrect.tmux"
run-shell "~/.tmux/plugins/tmux-continuum/continuum.tmux"
